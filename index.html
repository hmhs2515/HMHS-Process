<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.1">
    <title>HMHS Process Interactive Visualizer</title>
    <!-- Tailwind CSS for modern, fast styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .molecule { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Header -->
    <header class="border-b border-slate-800 py-6 px-4 text-center">
        <h1 class="text-3xl font-extrabold tracking-wider text-cyan-400">THE HMHS PROCESS</h1>
        <p class="text-sm text-slate-400 mt-2">Conceptualized by Hafiz Mohammed Huzaifa Shamim</p>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-4xl mx-auto p-6 w-full grid grid-cols-1 md:grid-cols-2 gap-8 my-auto">
        
        <!-- Interactive Controls (Left) -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between">
            <div>
                <h2 class="text-xl font-bold mb-4 text-cyan-300">Reaction Controller</h2>
                <p class="text-xs text-slate-400 mb-6">"Chemistry is fun... or disorder, according to your mindset."</p>
                
                <div class="space-y-4">
                    <!-- Step 1 Button -->
                    <button onclick="runStep(1)" class="w-full bg-slate-800 hover:bg-cyan-950/40 border border-slate-700 hover:border-cyan-500 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between">
                        <div>
                            <span class="text-xs font-bold text-cyan-400">STEP 1</span>
                            <p class="text-sm font-semibold">Inject Atmosphere (O₂, N₂, H₂O)</p>
                        </div>
                        <span id="indicator-1" class="h-3 w-3 rounded-full bg-slate-700"></span>
                    </button>

                    <!-- Step 2 Button -->
                    <button id="btn-2" onclick="runStep(2)" disabled class="w-full opacity-50 bg-slate-800 border border-slate-700 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between cursor-not-allowed">
                        <div>
                            <span class="text-xs font-bold text-cyan-400">STEP 2</span>
                            <p class="text-sm font-semibold">Add Na & Li Reagents</p>
                        </div>
                        <span id="indicator-2" class="h-3 w-3 rounded-full bg-slate-700"></span>
                    </button>

                    <!-- Step 3 Button -->
                    <button id="btn-3" onclick="runStep(3)" disabled class="w-full opacity-50 bg-slate-800 border border-slate-700 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between cursor-not-allowed">
                        <div>
                            <span class="text-xs font-bold text-cyan-400">STEP 3</span>
                            <p class="text-sm font-semibold">Execute pH Balancing Equation</p>
                        </div>
                        <span id="indicator-3" class="h-3 w-3 rounded-full bg-slate-700"></span>
                    </button>
                </div>
            </div>

            <!-- Reset Button -->
            <button onclick="resetSystem()" class="mt-8 text-xs text-slate-500 hover:text-red-400 transition-colors uppercase tracking-wider font-bold text-center w-full">
                Reset System Simulation
            </button>
        </div>

        <!-- System Output & Visualization (Right) -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl flex flex-col justify-between min-h-[350px]">
            <div>
                <h2 class="text-xl font-bold mb-4 text-emerald-400">Simulation Output</h2>
                <div id="visualizer-box" class="h-40 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center relative overflow-hidden mb-4">
                    <p id="placeholder-text" class="text-slate-600 text-sm">System Idle. Begin Step 1.</p>
                </div>
            </div>

            <!-- Reaction Logger -->
            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 font-mono text-xs text-slate-400 h-28 overflow-y-auto" id="terminal-log">
                > System ready... Waiting for user inputs.
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 HMHS Process. Built for community sharing.
    </footer>

    <!-- Logic Script -->
    <script>
        const logBox = document.getElementById('terminal-log');
        const visualizer = document.getElementById('visualizer-box');
        const placeholder = document.getElementById('placeholder-text');

        function log(message) {
            logBox.innerHTML += `<br>> ${message}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function runStep(step) {
            if (step === 1) {
                placeholder.classList.add('hidden');
                visualizer.innerHTML = `
                    <div class="flex gap-4">
                        <div class="molecule bg-cyan-500/20 text-cyan-400 p-3 rounded-full border border-cyan-500 font-bold text-xs">O₂</div>
                        <div class="molecule bg-blue-500/20 text-blue-400 p-3 rounded-full border border-blue-500 font-bold text-xs" style="animation-delay: 0.5s">N₂</div>
                        <div class="molecule bg-indigo-500/20 text-indigo-400 p-3 rounded-full border border-indigo-500 font-bold text-xs" style="animation-delay: 1s">H₂O</div>
                    </div>
                `;
                document.getElementById('indicator-1').className = "h-3 w-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                
                // Enable next step button
                const btn2 = document.getElementById('btn-2');
                btn2.disabled = false;
                btn2.className = "w-full bg-slate-800 hover:bg-cyan-950/40 border border-slate-700 hover:border-cyan-500 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between cursor-pointer";
                
                log("Atmospheric raw gases injected: O2, N2, H2O present in baseline ratios.");
                log("Intermediates generated: O-N -> NO -> NO-H2O.");
            }

            if (step === 2) {
                visualizer.innerHTML = `
                    <div class="flex flex-col items-center gap-2">
                        <div class="molecule bg-amber-500/20 text-amber-400 py-2 px-4 rounded-xl border border-amber-500 font-bold text-xs">[NO₂ Li Na (H)₄]</div>
                    </div>
                `;
                document.getElementById('indicator-2').className = "h-3 w-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                
                // Enable step 3 button
                const btn3 = document.getElementById('btn-3');
                btn3.disabled = false;
                btn3.className = "w-full bg-slate-800 hover:bg-cyan-950/40 border border-slate-700 hover:border-cyan-500 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between cursor-pointer";
                
                log("Sodium gas Na(g) added, converting intermediates to [N(HD)2 Na].");
                log("Mindset criteria matched. Lithium added. Synthesized: [NO2 Li Na (H)4]. Current pH: 2.");
            }

            if (step === 3) {
                visualizer.innerHTML = `
                    <div class="text-center">
                        <div class="text-3xl font-extrabold text-emerald-400 mb-1">State Ⓐ</div>
                        <div class="text-xs text-slate-400 font-mono">Algebraic Neutral (pH = 6)</div>
                    </div>
                `;
                document.getElementById('indicator-3').className = "h-3 w-3 rounded-full bg-emerald-500 shadow-lg shadow-emerald-500/50";
                
                log("Math system initialized. Comparing pH values: 7.34 vs 4.34.");
                log("Executing: (7.34 * 2) / 2 = (4.34 * 2) / 2 -> 14.68 = 8.68.");
                log("Subtracting yields: 6 = 0 (forgetting 0). Target isolated at A = 6.");
                log("SUCCESS: System consolidated to final balanced HMHS Process elements.");
            }
        }

        function resetSystem() {
            placeholder.classList.remove('hidden');
            visualizer.innerHTML = '<p id="placeholder-text" class="text-slate-600 text-sm">System Idle. Begin Step 1.</p>';
            
            // Reset indicators
            document.getElementById('indicator-1').className = "h-3 w-3 rounded-full bg-slate-700";
            document.getElementById('indicator-2').className = "h-3 w-3 rounded-full bg-slate-700";
            document.getElementById('indicator-3').className = "h-3 w-3 rounded-full bg-slate-700";

            // Disable buttons
            const btn2 = document.getElementById('btn-2');
            btn2.disabled = true;
            btn2.className = "w-full opacity-50 bg-slate-800 border border-slate-700 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between cursor-not-allowed";

            const btn3 = document.getElementById('btn-3');
            btn3.disabled = true;
            btn3.className = "w-full opacity-50 bg-slate-800 border border-slate-700 py-3 px-4 rounded-xl text-left transition-all flex items-center justify-between cursor-not-allowed";

            logBox.innerHTML = "> System reset. Waiting for user inputs.";
        }
    </script>
</body>
</html>
